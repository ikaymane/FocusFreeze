<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Pipeline: voice and sensor feed the Muse Spark planner, then the policy deny list, then your consent, then the actuator, with every action written to a tamper-evident log and a watchdog that thaws on crash">
  <title>How Focus Freeze works</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#31404A"/></marker>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .t { fill: #F1F5F7; font-size: 18px; font-weight: 600; }
    .s { fill: #A5B4BD; font-size: 13.5px; }
    .box { fill: #212E37; stroke: #31404A; stroke-width: 1.5; }
    .hl  { fill: none; stroke: #8ED8EE; stroke-width: 2.5; opacity: 0; animation: hl 7s infinite; }
    .h1 { animation-delay: .2s; } .h2 { animation-delay: 1.3s; } .h3 { animation-delay: 2.4s; } .h4 { animation-delay: 3.5s; } .h5 { animation-delay: 4.6s; }
    @keyframes hl { 0% { opacity: 0; } 4% { opacity: 1; } 16% { opacity: 1; } 24%,100% { opacity: 0; } }
    .flow { stroke: #8ED8EE; stroke-width: 2.5; fill: none; stroke-dasharray: 6 10; animation: dash 1.2s linear infinite; opacity: .55; }
    @keyframes dash { to { stroke-dashoffset: -32; } }
    .tick { opacity: 0; animation: tick 7s infinite; animation-delay: 4.9s; }
    @keyframes tick { 0% { opacity: 0; } 6%,40% { opacity: 1; } 50%,100% { opacity: 0; } }
    .wave rect { fill: #8ED8EE; transform-box: fill-box; transform-origin: center; animation: wv 1s infinite ease-in-out; }
    .wave rect:nth-child(2) { animation-delay: .15s; } .wave rect:nth-child(3) { animation-delay: .3s; } .wave rect:nth-child(4) { animation-delay: .45s; } .wave rect:nth-child(5) { animation-delay: .6s; }
    @keyframes wv { 0%,100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
    .blink { animation: bl 1.6s infinite; } @keyframes bl { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  </style>

  <rect width="1200" height="330" rx="22" fill="#121C23"/>
  <rect x=".5" y=".5" width="1199" height="329" rx="22" fill="none" stroke="#31404A"/>

  <!-- inputs -->
  <g transform="translate(36 40)">
    <rect class="box" width="170" height="74" rx="12"/>
    <g class="wave" transform="translate(18 22)"><rect x="0" y="0" width="5" height="28" rx="2.5"/><rect x="9" y="0" width="5" height="28" rx="2.5"/><rect x="18" y="0" width="5" height="28" rx="2.5"/><rect x="27" y="0" width="5" height="28" rx="2.5"/><rect x="36" y="0" width="5" height="28" rx="2.5"/></g>
    <text class="t" x="70" y="34">Voice</text>
    <text class="s" x="70" y="54">Muse Voice</text>
  </g>
  <g transform="translate(36 154)">
    <rect class="box" width="170" height="74" rx="12"/>
    <g transform="translate(18 20)" fill="none" stroke="#A5B4BD" stroke-width="2"><rect width="38" height="28" rx="4"/><path d="M0 8H38"/></g>
    <text class="t" x="70" y="34">Sensor</text>
    <text class="s" x="70" y="54">open windows</text>
  </g>

  <!-- links -->
  <path class="flow" d="M206 77 C240 77 240 150 262 150"/>
  <path class="flow" d="M206 191 C240 191 240 160 262 160"/>
  <path class="flow" d="M432 155 H474"/>
  <path class="flow" d="M644 155 H686"/>
  <path class="flow" d="M856 155 H898"/>
  <path class="flow" d="M983 192 V236"/>

  <!-- planner -->
  <g transform="translate(262 114)">
    <rect class="box" width="170" height="82" rx="12"/>
    <rect class="hl h1" width="170" height="82" rx="12"/>
    <text class="t" x="18" y="34">Planner</text>
    <text class="s" x="18" y="56">Muse Spark 1.3</text>
    <text class="s" x="18" y="73" fill="#8ED8EE" style="fill:#8ED8EE">reason per app</text>
  </g>
  <!-- policy -->
  <g transform="translate(474 114)">
    <rect class="box" width="170" height="82" rx="12"/>
    <rect class="hl h2" width="170" height="82" rx="12"/>
    <text class="t" x="18" y="34">Policy</text>
    <text class="s" x="18" y="56">deny list, runs after</text>
    <text class="s" x="18" y="73">the model, always wins</text>
  </g>
  <!-- consent -->
  <g transform="translate(686 114)">
    <rect class="box" width="170" height="82" rx="12"/>
    <rect class="hl h3" width="170" height="82" rx="12"/>
    <text class="t" x="18" y="34">You say yes</text>
    <text class="s" x="18" y="56">consent card</text>
    <text class="s" x="18" y="73">untick anything</text>
  </g>
  <!-- actuator -->
  <g transform="translate(898 114)">
    <rect class="box" width="170" height="78" rx="12"/>
    <rect class="hl h4" width="170" height="78" rx="12"/>
    <text class="t" x="18" y="34">Freeze</text>
    <text class="s" x="18" y="56">suspend + page RAM</text>
    <text class="s" x="18" y="73" style="fill:#8ED8EE">to disk</text>
  </g>
  <!-- ledger -->
  <g transform="translate(898 236)">
    <rect class="box" width="170" height="64" rx="12"/>
    <rect class="hl h5" width="170" height="64" rx="12"/>
    <text class="t" x="18" y="29">Audit log</text>
    <text class="s" x="18" y="49">tamper-evident</text>
    <g class="tick" transform="translate(146 24)"><circle r="10" fill="#6FD08C"/><path d="M-4.5 0-1 3.5 5-3" stroke="#0C2430" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>
  </g>

  <!-- watchdog -->
  <g transform="translate(262 248)">
    <circle class="blink" cx="8" cy="-5" r="5" fill="#F0B37E"/>
    <text class="s" x="22" y="0" style="font-size:15px">Watchdog process: if the app crashes, it thaws everything.</text>
  </g>
  <g transform="translate(262 274)">
    <circle cx="8" cy="-5" r="5" fill="#8ED8EE"/>
    <text class="s" x="22" y="0" style="font-size:15px">“I'm done” → every frozen app thaws, state intact.</text>
  </g>

  <text x="1164" y="58" text-anchor="end" fill="#A5B4BD" font-size="13" opacity=".7">nothing freezes without your yes</text>
</svg>
