<style>
text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
.in   { animation: in .9s cubic-bezier(.22,1,.36,1) both; }
.chip-in { animation: chipin .6s cubic-bezier(.22,1,.36,1) both; }
@keyframes in     { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes chipin { from { opacity: 0; transform: translateY(6px); }  to { opacity: 1; transform: none; } }
.loop { animation-timing-function: cubic-bezier(.65,0,.35,1); animation-iteration-count: infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.halo { transform-box: fill-box; transform-origin: center; animation: halo 5s cubic-bezier(.65,0,.35,1) infinite alternate; }
@keyframes halo { from { transform: scale(1); opacity: .10; } to { transform: scale(1.12); opacity: .22; } }
.ring { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 70 245;
         transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sheen { animation: sheen 9.6s cubic-bezier(.65,0,.35,1) infinite; }
@keyframes sheen { 0% { transform: translateX(0); } 22% { transform: translateX(1068px); } 100% { transform: translateX(1068px); } }

.edge0 { animation: edge0 9.6s cubic-bezier(.65,0,.35,1) infinite; }
@keyframes edge0 { 0%,100% { stroke: #27353F; } 8%,16% { stroke: #8ED8EE; stroke-opacity: .7; } 26% { stroke: #27353F; stroke-opacity: 1; } }
.edge1 { animation: edge1 9.6s cubic-bezier(.65,0,.35,1) infinite; }
@keyframes edge1 { 0%,100% { stroke: #27353F; } 8%,16% { stroke: #6FD08C; stroke-opacity: .7; } 26% { stroke: #27353F; stroke-opacity: 1; } }
.edge2 { animation: edge2 9.6s cubic-bezier(.65,0,.35,1) infinite; }
@keyframes edge2 { 0%,100% { stroke: #27353F; } 8%,16% { stroke: #E9C04C; stroke-opacity: .7; } 26% { stroke: #27353F; stroke-opacity: 1; } }
.edge3 { animation: edge3 9.6s cubic-bezier(.65,0,.35,1) infinite; }
@keyframes edge3 { 0%,100% { stroke: #27353F; } 8%,16% { stroke: #F0B37E; stroke-opacity: .7; } 26% { stroke: #27353F; stroke-opacity: 1; } }</style>
