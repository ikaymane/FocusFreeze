<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="How it works: voice and the window sensor feed the Muse Spark planner, then the policy deny list, then your consent, then the freeze, and every action goes to a tamper-evident log">
<title>How Focus Freeze works</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D151B"/><stop offset="1" stop-color="#121D25"/></linearGradient>
  <radialGradient id="aura" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8ED8EE" stop-opacity=".13"/><stop offset="1" stop-color="#8ED8EE" stop-opacity="0"/></radialGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C2933"/><stop offset="1" stop-color="#162029"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".38"/></filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  <g id="flake" fill="none" stroke-linecap="round"><path d="M0-11V11M-9.5-5.5 9.5 5.5M-9.5 5.5 9.5-5.5" stroke-width="2.4"/><path d="M-3-8 0-5 3-8M-3 8 0 5 3 8M-9.9-1.2-6.1-2.6-7.2-6.4M9.9 1.2 6.1 2.6 7.2 6.4M-9.9 1.2-6.1 2.6-7.2 6.4M9.9-1.2 6.1-2.6 7.2-6.4" stroke-width="1.6"/></g>
  
</defs>
<style>
text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
.in   { animation: in .9s cubic-bezier(.22,1,.36,1) both; }
.chip-in { animation: chipin .6s cubic-bezier(.22,1,.36,1) both; }
@keyframes in     { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes chipin { from { opacity: 0; transform: translateY(6px); }  to { opacity: 1; transform: none; } }
.loop { animation-timing-function: cubic-bezier(.65,0,.35,1); animation-iteration-count: infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.glow { opacity: 0; animation: glow 3s cubic-bezier(.65,0,.35,1) infinite; }
@keyframes glow { 0% { opacity: 0; } 6%,28% { opacity: 1; } 44%,100% { opacity: 0; } }
.flow { stroke-dasharray: 2 12; animation: dash 1.4s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -28; } }
.wave rect { transform-box: fill-box; transform-origin: center; animation: wv 1s cubic-bezier(.65,0,.35,1) infinite; }
.wave rect:nth-child(2) { animation-delay: .15s; } .wave rect:nth-child(3) { animation-delay: .3s; }
.wave rect:nth-child(4) { animation-delay: .45s; } .wave rect:nth-child(5) { animation-delay: .6s; }
@keyframes wv { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
.breathe { animation: breathe 2.4s cubic-bezier(.65,0,.35,1) infinite alternate; }
@keyframes breathe { from { opacity: .35; } to { opacity: 1; } }
</style>
<rect width="1200" height="380" rx="24" fill="url(#bg)"/>
<ellipse cx="180" cy="20" rx="560" ry="300" fill="url(#aura)"/>
<ellipse cx="1080" cy="380" rx="420" ry="220" fill="url(#aura)" opacity=".6"/>
<rect x=".5" y=".5" width="1199" height="379" rx="23.5" fill="none" stroke="#27353F"/>
<g class="in">
  <text x="48" y="54" fill="#8ED8EE" font-size="13" font-weight="700" letter-spacing="2.4">HOW IT WORKS</text>
  <text x="48" y="88" fill="#F1F5F7" font-size="26" font-weight="700">Nothing freezes without your yes</text>
  
</g>
<g fill="none" stroke-width="2">
  <path d="M200 154 C222 154 218 192.0 240 192.0 H1148" stroke="#27353F"/><path d="M200 230 C222 230 218 192.0 240 192.0 H1148" stroke="#27353F"/>
  <path class="flow" d="M200 154 C222 154 218 192.0 240 192.0 H1148" stroke="#8ED8EE" stroke-opacity=".5" stroke-linecap="round"/>
  <path class="flow" d="M200 230 C222 230 218 192.0 240 192.0 H1148" stroke="#8ED8EE" stroke-opacity=".5" stroke-linecap="round"/>
</g>
<g>
    <circle r="12" fill="#8ED8EE" opacity=".25" filter="url(#blur)"/><circle r="5" fill="#B4E7F5"/>
    <animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M200 154 C222 154 218 192.0 240 192.0 H1148"/>
    <animate attributeName="opacity" dur="6s" begin="0s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.04;.94;1"/>
  </g>
<g>
    <circle r="12" fill="#8ED8EE" opacity=".25" filter="url(#blur)"/><circle r="5" fill="#B4E7F5"/>
    <animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M200 230 C222 230 218 192.0 240 192.0 H1148"/>
    <animate attributeName="opacity" dur="6s" begin="3s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.04;.94;1"/>
  </g>

  <g transform="translate(40 124)"><g class="in" style="animation-delay:.2s">
    <rect width="160" height="60" rx="14" fill="url(#card)" filter="url(#shadow)"/><rect x=".5" y=".5" width="159" height="59" rx="13.5" fill="none" stroke="#27353F"/>
    <g class="wave" transform="translate(18 21)" fill="#8ED8EE"><rect width="4" height="18" rx="2"/><rect x="8" width="4" height="18" rx="2"/><rect x="16" width="4" height="18" rx="2"/><rect x="24" width="4" height="18" rx="2"/><rect x="32" width="4" height="18" rx="2"/></g>
    <text x="64" y="28" fill="#F1F5F7" font-size="16" font-weight="700">Voice</text>
    <text x="64" y="46" fill="#93A4AE" font-size="12.5">Muse Voice</text>
  </g></g>
  <g transform="translate(40 200)"><g class="in" style="animation-delay:.25s">
    <rect width="160" height="60" rx="14" fill="url(#card)" filter="url(#shadow)"/><rect x=".5" y=".5" width="159" height="59" rx="13.5" fill="none" stroke="#27353F"/>
    <g transform="translate(18 17)" fill="none" stroke="#93A4AE" stroke-width="2"><rect width="34" height="26" rx="4"/><path d="M0 7H34"/></g>
    <text x="64" y="28" fill="#F1F5F7" font-size="16" font-weight="700">Sensor</text>
    <text x="64" y="46" fill="#93A4AE" font-size="12.5">open windows</text>
  </g></g>
<g transform="translate(240 126)">
    <g class="in" style="animation-delay:0.30s">
      <rect class="glow" style="animation-delay:0.26s" x="-6" y="-6" width="168" height="144" rx="22" fill="#8ED8EE" fill-opacity=".22" filter="url(#blur)"/>
      <rect width="156" height="132" rx="16" fill="url(#card)" filter="url(#shadow)"/><rect x=".5" y=".5" width="155" height="131" rx="15.5" fill="none" stroke="#27353F"/>
      <rect class="glow" style="animation-delay:0.26s" x=".75" y=".75" width="154.5" height="130.5" rx="15.25" fill="none" stroke="#8ED8EE" stroke-width="1.5"/>
      <g transform="translate(36 36)"><circle r="20" fill="#8ED8EE" fill-opacity=".12"/><path d="M0-10C1 -3 3-1 10 0 3 1 1 3 0 10-1 3-3 1-10 0-3-1-1-3 0-10Z" fill="#8ED8EE"/></g>
      <text x="18" y="82" fill="#F1F5F7" font-size="17" font-weight="700">Planner</text>
      <text x="18" y="102" fill="#93A4AE" font-size="13.5">Muse Spark 1.3</text>
      <text x="18" y="120" fill="#93A4AE" font-size="13.5">a reason per app</text>
    </g>
  </g><g transform="translate(428 126)">
    <g class="in" style="animation-delay:0.40s">
      <rect class="glow" style="animation-delay:1.44s" x="-6" y="-6" width="168" height="144" rx="22" fill="#8ED8EE" fill-opacity=".22" filter="url(#blur)"/>
      <rect width="156" height="132" rx="16" fill="url(#card)" filter="url(#shadow)"/><rect x=".5" y=".5" width="155" height="131" rx="15.5" fill="none" stroke="#27353F"/>
      <rect class="glow" style="animation-delay:1.44s" x=".75" y=".75" width="154.5" height="130.5" rx="15.25" fill="none" stroke="#8ED8EE" stroke-width="1.5"/>
      <g transform="translate(36 36)"><circle r="20" fill="#8ED8EE" fill-opacity=".12"/><path d="M0-10 8-7V-1C8 5 4 8 0 10-4 8-8 5-8-1V-7Z" fill="none" stroke="#8ED8EE" stroke-width="2"/><path d="M-3.5 0-.5 3 4-2" stroke="#8ED8EE" stroke-width="2" fill="none" stroke-linecap="round"/></g>
      <text x="18" y="82" fill="#F1F5F7" font-size="17" font-weight="700">Policy</text>
      <text x="18" y="102" fill="#93A4AE" font-size="13.5">deny list runs after</text>
      <text x="18" y="120" fill="#93A4AE" font-size="13.5">the model, and wins</text>
    </g>
  </g><g transform="translate(616 126)">
    <g class="in" style="animation-delay:0.50s">
      <rect class="glow" style="animation-delay:2.62s" x="-6" y="-6" width="168" height="144" rx="22" fill="#8ED8EE" fill-opacity=".22" filter="url(#blur)"/>
      <rect width="156" height="132" rx="16" fill="url(#card)" filter="url(#shadow)"/><rect x=".5" y=".5" width="155" height="131" rx="15.5" fill="none" stroke="#27353F"/>
      <rect class="glow" style="animation-delay:2.62s" x=".75" y=".75" width="154.5" height="130.5" rx="15.25" fill="none" stroke="#8ED8EE" stroke-width="1.5"/>
      <g transform="translate(36 36)"><circle r="20" fill="#8ED8EE" fill-opacity=".12"/><circle r="9" fill="none" stroke="#8ED8EE" stroke-width="2"/><path d="M-4 0-1 3 4-3" stroke="#8ED8EE" stroke-width="2.2" fill="none" stroke-linecap="round"/></g>
      <text x="18" y="82" fill="#F1F5F7" font-size="17" font-weight="700">You say yes</text>
      <text x="18" y="102" fill="#93A4AE" font-size="13.5">consent card,</text>
      <text x="18" y="120" fill="#93A4AE" font-size="13.5">untick anything</text>
    </g>
  </g><g transform="translate(804 126)">
    <g class="in" style="animation-delay:0.60s">
      <rect class="glow" style="animation-delay:3.80s" x="-6" y="-6" width="168" height="144" rx="22" fill="#8ED8EE" fill-opacity=".22" filter="url(#blur)"/>
      <rect width="156" height="132" rx="16" fill="url(#card)" filter="url(#shadow)"/><rect x=".5" y=".5" width="155" height="131" rx="15.5" fill="none" stroke="#27353F"/>
      <rect class="glow" style="animation-delay:3.80s" x=".75" y=".75" width="154.5" height="130.5" rx="15.25" fill="none" stroke="#8ED8EE" stroke-width="1.5"/>
      <g transform="translate(36 36)"><circle r="20" fill="#8ED8EE" fill-opacity=".12"/><use href="#flake" stroke="#8ED8EE" transform="scale(.8)"/></g>
      <text x="18" y="82" fill="#F1F5F7" font-size="17" font-weight="700">Freeze</text>
      <text x="18" y="102" fill="#93A4AE" font-size="13.5">suspend + page</text>
      <text x="18" y="120" fill="#93A4AE" font-size="13.5">RAM to disk</text>
    </g>
  </g><g transform="translate(992 126)">
    <g class="in" style="animation-delay:0.70s">
      <rect class="glow" style="animation-delay:4.97s" x="-6" y="-6" width="168" height="144" rx="22" fill="#8ED8EE" fill-opacity=".22" filter="url(#blur)"/>
      <rect width="156" height="132" rx="16" fill="url(#card)" filter="url(#shadow)"/><rect x=".5" y=".5" width="155" height="131" rx="15.5" fill="none" stroke="#27353F"/>
      <rect class="glow" style="animation-delay:4.97s" x=".75" y=".75" width="154.5" height="130.5" rx="15.25" fill="none" stroke="#8ED8EE" stroke-width="1.5"/>
      <g transform="translate(36 36)"><circle r="20" fill="#8ED8EE" fill-opacity=".12"/><path d="M-7-6H7M-7 0H7M-7 6H3" stroke="#8ED8EE" stroke-width="2.2" stroke-linecap="round"/></g>
      <text x="18" y="82" fill="#F1F5F7" font-size="17" font-weight="700">Audit log</text>
      <text x="18" y="102" fill="#93A4AE" font-size="13.5">every action,</text>
      <text x="18" y="120" fill="#93A4AE" font-size="13.5">tamper-evident</text>
    </g>
  </g>
<g class="in" style="animation-delay:.9s" font-size="15">
  <circle class="breathe" cx="246" cy="309" r="5" fill="#F0B37E"/>
  <text x="260" y="314" fill="#93A4AE"><tspan fill="#F1F5F7" font-weight="600">Watchdog.</tspan> If the app crashes, a separate process thaws everything.</text>
  <circle class="breathe" style="animation-delay:-1.2s" cx="246" cy="339" r="5" fill="#8ED8EE"/>
  <text x="260" y="344" fill="#93A4AE"><tspan fill="#F1F5F7" font-weight="600">“I'm done.”</tspan> Every frozen app thaws, state intact.</text>
</g>
</svg>
