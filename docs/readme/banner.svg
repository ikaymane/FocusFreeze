          <text class="n55 T loop" x="532" y="21" fill="#6FD08C">55%</text>
        </g>
      </g>
      <g transform="translate(14 100)"><rect width="168" height="104" rx="12" fill="#1C2933" stroke="#27353F"/><rect x="14" y="14" width="34" height="34" rx="9" fill="#4A7BD0"/><text x="31" y="37" text-anchor="middle" fill="#F1F5F7" font-size="17" font-weight="700">W</text><text x="14" y="72" fill="#F1F5F7" font-size="16" font-weight="600">Thesis.docx</text><text x="14" y="92" fill="#93A4AE" font-size="13">your task</text></g><g transform="translate(196 100)"><rect width="168" height="104" rx="12" fill="#1C2933" stroke="#27353F"/><rect x="14" y="14" width="34" height="34" rx="9" fill="#C9473B"/><text x="31" y="37" text-anchor="middle" fill="#F1F5F7" font-size="14" font-weight="700">PDF</text><text x="14" y="72" fill="#F1F5F7" font-size="16" font-weight="600">Heat islands.pdf</text><text class="idle T loop" x="14" y="92" fill="#93A4AE" font-size="13">idle 40 min</text><text class="keep T loop" x="14" y="92" fill="#8ED8EE" font-size="13" font-weight="700">AI keeps it: your source</text></g><g transform="translate(378 100)">
      <g class="dim T loop"><rect width="168" height="104" rx="12" fill="#1C2933" stroke="#27353F"/><rect x="14" y="14" width="34" height="34" rx="9" fill="#5865D9"/><text x="31" y="37" text-anchor="middle" fill="#F1F5F7" font-size="17" font-weight="700">D</text><text x="14" y="72" fill="#F1F5F7" font-size="16" font-weight="600">Discord</text><text x="14" y="92" fill="#93A4AE" font-size="13">unrelated to thesis</text></g>
      <rect class="frost T loop" width="168" height="104" rx="12" fill="url(#frostg)" stroke="#8ED8EE" stroke-width="1.5"/>
      <g transform="translate(140 30)"><use class="fl T loop" href="#flake" stroke="#B4E7F5"/></g>
      <g class="tag T loop"><rect x="100" y="14" width="56" height="22" rx="11" fill="#8ED8EE" fill-opacity=".1" stroke="#8ED8EE" stroke-dasharray="4 3"/><text x="128" y="29" text-anchor="middle" fill="#8ED8EE" font-size="12">freeze</text></g>
    </g><g transform="translate(14 218)">
      <g class="dim T loop" style="animation-delay:0.12s"><rect width="168" height="104" rx="12" fill="#1C2933" stroke="#27353F"/><rect x="14" y="14" width="34" height="34" rx="9" fill="#2A475E"/><text x="31" y="37" text-anchor="middle" fill="#F1F5F7" font-size="17" font-weight="700">S</text><text x="14" y="72" fill="#F1F5F7" font-size="16" font-weight="600">Steam</text><text x="14" y="92" fill="#93A4AE" font-size="13">game launcher</text></g>
      <rect class="frost T loop" style="animation-delay:0.12s" width="168" height="104" rx="12" fill="url(#frostg)" stroke="#8ED8EE" stroke-width="1.5"/>
      <g transform="translate(140 30)"><use class="fl T loop" style="animation-delay:0.12s" href="#flake" stroke="#B4E7F5"/></g>
      <g class="tag T loop" style="animation-delay:0.12s"><rect x="100" y="14" width="56" height="22" rx="11" fill="#8ED8EE" fill-opacity=".1" stroke="#8ED8EE" stroke-dasharray="4 3"/><text x="128" y="29" text-anchor="middle" fill="#8ED8EE" font-size="12">freeze</text></g>
    </g><g transform="translate(196 218)">
      <g class="dim T loop" style="animation-delay:0.24s"><rect width="168" height="104" rx="12" fill="#1C2933" stroke="#27353F"/><rect x="14" y="14" width="34" height="34" rx="9" fill="#6264A7"/><text x="31" y="37" text-anchor="middle" fill="#F1F5F7" font-size="17" font-weight="700">T</text><text x="14" y="72" fill="#F1F5F7" font-size="16" font-weight="600">Teams</text><text x="14" y="92" fill="#93A4AE" font-size="13">no meeting now</text></g>
      <rect class="frost T loop" style="animation-delay:0.24s" width="168" height="104" rx="12" fill="url(#frostg)" stroke="#8ED8EE" stroke-width="1.5"/>
      <g transform="translate(140 30)"><use class="fl T loop" style="animation-delay:0.24s" href="#flake" stroke="#B4E7F5"/></g>
      <g class="tag T loop" style="animation-delay:0.24s"><rect x="100" y="14" width="56" height="22" rx="11" fill="#8ED8EE" fill-opacity=".1" stroke="#8ED8EE" stroke-dasharray="4 3"/><text x="128" y="29" text-anchor="middle" fill="#8ED8EE" font-size="12">freeze</text></g>
    </g><g transform="translate(378 218)">
      <g class="dim T loop" style="animation-delay:0.36s"><rect width="168" height="104" rx="12" fill="#1C2933" stroke="#27353F"/><rect x="14" y="14" width="34" height="34" rx="9" fill="#4A154B"/><text x="31" y="37" text-anchor="middle" fill="#F1F5F7" font-size="17" font-weight="700">S</text><text x="14" y="72" fill="#F1F5F7" font-size="16" font-weight="600">Slack</text><text x="14" y="92" fill="#93A4AE" font-size="13">background chat</text></g>
      <rect class="frost T loop" style="animation-delay:0.36s" width="168" height="104" rx="12" fill="url(#frostg)" stroke="#8ED8EE" stroke-width="1.5"/>
      <g transform="translate(140 30)"><use class="fl T loop" style="animation-delay:0.36s" href="#flake" stroke="#B4E7F5"/></g>
      <g class="tag T loop" style="animation-delay:0.36s"><rect x="100" y="14" width="56" height="22" rx="11" fill="#8ED8EE" fill-opacity=".1" stroke="#8ED8EE" stroke-dasharray="4 3"/><text x="128" y="29" text-anchor="middle" fill="#8ED8EE" font-size="12">freeze</text></g>
