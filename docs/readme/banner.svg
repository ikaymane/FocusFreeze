  <circle class="mote" style="animation-delay:-4s" cx="452" cy="404" r="2.2"/><circle class="mote" style="animation-delay:-1s" cx="60" cy="350" r="1.4"/>
</g>

<g transform="translate(56 0)"><g class="in">
  <g transform="translate(0 52)">
    <rect width="314" height="26" rx="13" fill="#8ED8EE" fill-opacity=".1" stroke="#8ED8EE" stroke-opacity=".35"/>
    <text x="12" y="17.5" fill="#8ED8EE" font-size="11.5" font-weight="700" letter-spacing="1.4">META GLOBAL AI DEV HACKATHON · 2026</text>
  </g>
  <use href="#flake" stroke="#8ED8EE" transform="translate(24 140) scale(1.9)"/>
  <text x="62" y="160" fill="#F1F5F7" font-size="56" font-weight="700" letter-spacing="-1">Focus Freeze</text>
  <text x="0" y="208" fill="#93A4AE" font-size="20.5">Tell it what you're working on.</text>
  <text x="0" y="238" fill="#93A4AE" font-size="20.5">It freezes the apps you don't need,</text>
  <text x="0" y="268" fill="#93A4AE" font-size="20.5">and thaws them, state intact, when you're done.</text>
  <g transform="translate(0 300)">
    <rect width="468" height="48" rx="12" fill="url(#card)" stroke="#27353F"/>
    <g class="m1 T loop"><circle cx="22" cy="24" r="5" fill="#EF6F5E"/><text x="38" y="29.5" fill="#F1F5F7" font-size="16.5">RAM at 90%. Everything stutters.</text></g><g class="m2 T loop"><circle cx="22" cy="24" r="5" fill="#E9C04C"/><text x="38" y="29.5" fill="#F1F5F7" font-size="16.5">Muse Spark: 4 apps to freeze, 2 to keep</text></g><g class="m3 T loop"><circle cx="22" cy="24" r="5" fill="#8ED8EE"/><text x="38" y="29.5" fill="#F1F5F7" font-size="16.5">Frozen. RAM paged to disk, windows open</text></g><g class="m4 T loop"><circle cx="22" cy="24" r="5" fill="#F0B37E"/><text x="38" y="29.5" fill="#F1F5F7" font-size="16.5">Thawed, each app right where you left it</text></g>
  </g>
  <g transform="translate(0 376)" font-size="13">
    <rect width="148" height="28" rx="14" fill="#111A21" stroke="#27353F"/><circle cx="16" cy="14" r="4" fill="#8ED8EE"/><text x="28" y="18.5" fill="#C4D0D6">muse-spark-1.3</text>
    <rect x="158" width="214" height="28" rx="14" fill="#111A21" stroke="#27353F"/><circle cx="174" cy="14" r="4" fill="#8ED8EE"/><text x="186" y="18.5" fill="#C4D0D6">muse-voice-transcribe-1.0</text>
  </g>
</g></g>

