<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Focus Freeze: tell it your task, it freezes the apps you don&#x27;t need (RAM 90% to 55%), then thaws them when you&#x27;re done">
<title>Focus Freeze</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D151B"/><stop offset="1" stop-color="#121D25"/></linearGradient>
  <radialGradient id="aura" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8ED8EE" stop-opacity=".13"/><stop offset="1" stop-color="#8ED8EE" stop-opacity="0"/></radialGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C2933"/><stop offset="1" stop-color="#162029"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".38"/></filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  <g id="flake" fill="none" stroke-linecap="round"><path d="M0-11V11M-9.5-5.5 9.5 5.5M-9.5 5.5 9.5-5.5" stroke-width="2.4"/><path d="M-3-8 0-5 3-8M-3 8 0 5 3 8M-9.9-1.2-6.1-2.6-7.2-6.4M9.9 1.2 6.1 2.6 7.2 6.4M-9.9 1.2-6.1 2.6-7.2 6.4M9.9-1.2 6.1-2.6 7.2-6.4" stroke-width="1.6"/></g>
  <linearGradient id="frostg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B4E7F5" stop-opacity=".42"/><stop offset=".55" stop-color="#8ED8EE" stop-opacity=".14"/><stop offset="1" stop-color="#B4E7F5" stop-opacity=".36"/></linearGradient>
  <clipPath id="win"><rect width="560" height="388" rx="16"/></clipPath>
</defs>
<style>
text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
.in   { animation: in .9s cubic-bezier(.22,1,.36,1) both; }
.chip-in { animation: chipin .6s cubic-bezier(.22,1,.36,1) both; }
@keyframes in     { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes chipin { from { opacity: 0; transform: translateY(6px); }  to { opacity: 1; transform: none; } }
.loop { animation-timing-function: cubic-bezier(.65,0,.35,1); animation-iteration-count: infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.T { animation-duration: 12s; }
.bar  { transform-box: fill-box; transform-origin: left center; transform: scaleX(.9); fill: #EF6F5E; animation-name: bar; }
.n90  { animation-name: n90; } .n55 { opacity: 0; animation-name: n55; }
.m1 { animation-name: m1; } .m2, .m3, .m4 { opacity: 0; }
.m2 { animation-name: m2; } .m3 { animation-name: m3; } .m4 { animation-name: m4; }
.toast1 { opacity: 0; animation-name: toast1; } .toast2 { opacity: 0; animation-name: toast2; }
.tag  { opacity: 0; animation-name: tag; }
.keep { opacity: 0; animation-name: keep; } .idle { animation-name: idle; }
.dim  { animation-name: dim; }
.frost { opacity: 0; animation-name: frost; }
.fl   { opacity: 0; transform-box: fill-box; transform-origin: center; animation-name: fl; }
.wave rect { transform-box: fill-box; transform-origin: center; animation: wv 1s cubic-bezier(.65,0,.35,1) infinite; }
.wave rect:nth-child(2) { animation-delay: .15s; } .wave rect:nth-child(3) { animation-delay: .3s; }
.wave rect:nth-child(4) { animation-delay: .45s; } .wave rect:nth-child(5) { animation-delay: .6s; }
@keyframes wv { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
.mote { animation: mote 6s cubic-bezier(.65,0,.35,1) infinite alternate; }
@keyframes mote { from { opacity: .1; transform: translateY(0); } to { opacity: .8; transform: translateY(-10px); } }
@keyframes bar { 0%,44% { transform: scaleX(.9); fill: #EF6F5E; } 50% { fill: #E9C04C; } 56%,82% { transform: scaleX(.55); fill: #6FD08C; } 87% { fill: #E9C04C; } 92%,100% { transform: scaleX(.9); fill: #EF6F5E; } }@keyframes n90 { 0%,44% { opacity: 1; transform: none; } 49% { opacity: 0; transform: translateY(-10px); } 86% { opacity: 0; transform: translateY(10px); } 91%,100% { opacity: 1; transform: none; } }@keyframes n55 { 0%,47% { opacity: 0; transform: translateY(10px); } 53%,82% { opacity: 1; transform: none; } 87%,100% { opacity: 0; transform: translateY(-10px); } }@keyframes m1 { 0%,10% { opacity: 1; transform: none; } 14% { opacity: 0; transform: translateY(-6px); } 96% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: none; } }@keyframes m2 { 0%,14% { opacity: 0; transform: translateY(6px); } 18%,40% { opacity: 1; transform: none; } 44%,100% { opacity: 0; transform: translateY(-6px); } }@keyframes m3 { 0%,44% { opacity: 0; transform: translateY(6px); } 48%,75% { opacity: 1; transform: none; } 79%,100% { opacity: 0; transform: translateY(-6px); } }@keyframes m4 { 0%,84% { opacity: 0; transform: translateY(6px); } 88%,93% { opacity: 1; transform: none; } 97%,100% { opacity: 0; transform: translateY(-6px); } }@keyframes toast1 { 0%,12% { opacity: 0; transform: translateY(8px); } 16%,29% { opacity: 1; transform: none; } 33%,100% { opacity: 0; transform: translateY(8px); } }@keyframes toast2 { 0%,75% { opacity: 0; transform: translateY(8px); } 79%,86% { opacity: 1; transform: none; } 90%,100% { opacity: 0; transform: translateY(8px); } }@keyframes tag { 0%,24% { opacity: 0; } 29%,41% { opacity: 1; } 46%,100% { opacity: 0; } }@keyframes keep { 0%,24% { opacity: 0; } 29%,84% { opacity: 1; } 89%,100% { opacity: 0; } }@keyframes idle { 0%,24% { opacity: 1; } 29%,84% { opacity: 0; } 89%,100% { opacity: 1; } }@keyframes dim { 0%,43% { opacity: 1; } 50%,82% { opacity: .4; } 89%,100% { opacity: 1; } }@keyframes frost { 0%,43% { opacity: 0; } 50%,82% { opacity: 1; } 89%,100% { opacity: 0; } }@keyframes fl { 0%,43% { opacity: 0; transform: scale(.5) rotate(-40deg); } 51%,82% { opacity: 1; transform: scale(1) rotate(0); } 89%,100% { opacity: 0; transform: scale(.5) rotate(40deg); } }</style>
<rect width="1200" height="460" rx="24" fill="url(#bg)"/>
<ellipse cx="180" cy="20" rx="560" ry="300" fill="url(#aura)"/>
<ellipse cx="1080" cy="460" rx="420" ry="220" fill="url(#aura)" opacity=".6"/>
<rect x=".5" y=".5" width="1199" height="459" rx="23.5" fill="none" stroke="#27353F"/>

<g fill="#B4E7F5">
