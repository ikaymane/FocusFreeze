<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Focus Freeze: apps you don't need freeze, memory drops from 90% to 55%, and they thaw when you're done">
  <title>Focus Freeze</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101A21"/>
      <stop offset="1" stop-color="#18232B"/>
    </linearGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B4E7F5" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#8ED8EE" stop-opacity=".25"/>
      <stop offset="1" stop-color="#B4E7F5" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ED8EE" stop-opacity="0"/>
      <stop offset=".5" stop-color="#B4E7F5" stop-opacity=".9"/>
      <stop offset="1" stop-color="#8ED8EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8ED8EE" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8ED8EE" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen"><rect x="560" y="44" width="600" height="352" rx="14"/></clipPath>
    <g id="flake" stroke="#B4E7F5" stroke-width="2.4" stroke-linecap="round" fill="none">
      <path d="M0-11V11M-9.5-5.5 9.5 5.5M-9.5 5.5 9.5-5.5"/>
      <path d="M-3-8 0-5 3-8M-3 8 0 5 3 8M-9.9-1.2-6.1-2.6-7.2-6.4M9.9 1.2 6.1 2.6 7.2 6.4M-9.9 1.2-6.1 2.6-7.2 6.4M9.9-1.2 6.1-2.6 7.2-6.4" stroke-width="1.6"/>
    </g>
  </defs>

  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .ink { fill: #F1F5F7; } .muted { fill: #A5B4BD; } .ice { fill: #8ED8EE; }
    /* one 10 s loop: busy -> card -> freeze -> calm -> "I'm done" -> thaw */
    .fz      { animation: fz 10s infinite; }
    .frostc  { animation: frostc 10s infinite; opacity: 0; }
    .tag     { animation: tag 10s infinite; opacity: 0; }
    .keep    { animation: keep 10s infinite; opacity: 0; }
    .sweep   { animation: sweep 10s infinite; opacity: 0; }
    .bar     { transform-box: fill-box; transform-origin: left center; animation: bar 10s infinite; }
    .n90 { animation: n90 10s infinite; } .n72 { animation: n72 10s infinite; opacity: 0; } .n55 { animation: n55 10s infinite; opacity: 0; }
    .s1 { animation: s1 10s infinite; } .s2 { animation: s2 10s infinite; opacity: 0; } .s3 { animation: s3 10s infinite; opacity: 0; } .s4 { animation: s4 10s infinite; opacity: 0; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 10s infinite; }
    .tw1 { animation: tw 3.2s infinite ease-in-out; } .tw2 { animation: tw 4.1s 1s infinite ease-in-out; } .tw3 { animation: tw 3.7s 2s infinite ease-in-out; }
    .d1 { animation-delay: 0s; } .d2 { animation-delay: .12s; } .d3 { animation-delay: .24s; } .d4 { animation-delay: .36s; }

    @keyframes fz     { 0%,32% { opacity: 1; filter: none; } 38%,72% { opacity: .38; } 80%,100% { opacity: 1; } }
    @keyframes frostc { 0%,32% { opacity: 0; } 38%,72% { opacity: 1; } 80%,100% { opacity: 0; } }
    @keyframes tag    { 0%,12% { opacity: 0; } 16%,32% { opacity: 1; } 36%,100% { opacity: 0; } }
    @keyframes keep   { 0%,12% { opacity: 0; } 16%,72% { opacity: 1; } 78%,100% { opacity: 0; } }
    @keyframes sweep  { 0%,30% { opacity: 0; transform: translateX(-640px); } 31% { opacity: 1; } 39% { opacity: 1; transform: translateX(640px); } 40%,100% { opacity: 0; transform: translateX(640px); } }
    @keyframes bar    { 0%,34% { transform: scaleX(.9); fill: #EF6F5E; } 44%,72% { transform: scaleX(.55); fill: #6FD08C; } 82%,100% { transform: scaleX(.9); fill: #EF6F5E; } }
    @keyframes n90 { 0%,34% { opacity: 1; } 37%,77% { opacity: 0; } 82%,100% { opacity: 1; } }
    @keyframes n72 { 0%,35% { opacity: 0; } 37%,40% { opacity: 1; } 42%,77% { opacity: 0; } 79%,80% { opacity: 1; } 82%,100% { opacity: 0; } }
    @keyframes n55 { 0%,40% { opacity: 0; } 43%,77% { opacity: 1; } 79%,100% { opacity: 0; } }
    @keyframes s1 { 0%,12% { opacity: 1; } 15%,100% { opacity: 0; } }
    @keyframes s2 { 0%,13% { opacity: 0; } 16%,31% { opacity: 1; } 34%,100% { opacity: 0; } }
    @keyframes s3 { 0%,32% { opacity: 0; } 36%,70% { opacity: 1; } 73%,100% { opacity: 0; } }
    @keyframes s4 { 0%,71% { opacity: 0; } 74%,96% { opacity: 1; } 99%,100% { opacity: 0; } }
    @keyframes spin { 0%,32% { transform: rotate(0) scale(0); } 40% { transform: rotate(180deg) scale(1.1); } 44%,72% { transform: rotate(180deg) scale(1); } 80%,100% { transform: rotate(360deg) scale(0); } }
    @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
  </style>

  <rect width="1200" height="440" rx="22" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="439" rx="22" fill="none" stroke="#31404A"/>
  <circle cx="300" cy="200" r="260" fill="url(#glow)" opacity=".5"/>

  <!-- drifting ice motes -->
  <g fill="#B4E7F5">
    <circle class="tw1" cx="92" cy="58" r="2"/><circle class="tw2" cx="470" cy="84" r="1.6"/>
    <circle class="tw3" cx="410" cy="372" r="2.2"/><circle class="tw1" cx="58" cy="330" r="1.4"/>
    <circle class="tw2" cx="520" cy="250" r="1.4"/><circle class="tw3" cx="250" cy="40" r="1.6"/>
  </g>

  <!-- left: name and promise -->
  <g transform="translate(56 0)">
    <use href="#flake" transform="translate(22 128) scale(1.7)"/>
    <text x="54" y="146" class="ink" font-size="50" font-weight="700" letter-spacing="-1">Focus Freeze</text>
    <text x="2" y="196" class="muted" font-size="21">Tell it what you're working on.</text>
    <text x="2" y="226" class="muted" font-size="21">It freezes the apps you don't need,</text>
    <text x="2" y="256" class="muted" font-size="21">and thaws them, state intact, when you're done.</text>

    <!-- live status line -->
    <g transform="translate(2 300)" font-size="17">
      <rect width="440" height="44" rx="10" fill="#212E37" stroke="#31404A"/>
      <g transform="translate(18 28)">
        <g class="s1"><circle cx="0" cy="-6" r="5" fill="#EF6F5E"/><text x="16" y="0" class="ink">RAM at 90%. Everything stutters.</text></g>
        <g class="s2"><circle cx="0" cy="-6" r="5" fill="#E9C04C"/><text x="16" y="0" class="ink">“Writing my thesis.” Freeze 4 apps?</text></g>
        <g class="s3"><circle cx="0" cy="-6" r="5" fill="#8ED8EE"/><text x="16" y="0" class="ink">4 apps frozen. RAM paged to disk.</text></g>
        <g class="s4"><circle cx="0" cy="-6" r="5" fill="#F0B37E"/><text x="16" y="0" class="ink">“I'm done.” Thawed, right where you left.</text></g>
      </g>
    </g>
    <text x="2" y="392" class="muted" font-size="14" opacity=".75">Muse Spark plans · Muse Voice listens · you approve every freeze</text>
  </g>

  <!-- right: the desk -->
  <rect x="560" y="44" width="600" height="352" rx="14" fill="#0E171D" stroke="#31404A"/>
  <g clip-path="url(#screen)">
    <!-- title bar -->
    <rect x="560" y="44" width="600" height="34" fill="#18232B"/>
    <circle cx="582" cy="61" r="5" fill="#31404A"/><circle cx="598" cy="61" r="5" fill="#31404A"/><circle cx="614" cy="61" r="5" fill="#31404A"/>
    <text x="860" y="66" text-anchor="middle" class="muted" font-size="14">4 GB laptop · a normal day</text>

    <!-- RAM gauge -->
    <g transform="translate(584 96)">
      <text x="0" y="16" class="muted" font-size="15">Memory</text>
      <rect x="78" y="4" width="402" height="16" rx="8" fill="#2A3843"/>
      <rect class="bar" x="78" y="4" width="402" height="16" rx="8" fill="#EF6F5E"/>
      <g font-size="22" font-weight="700" text-anchor="end">
        <text class="n90" x="552" y="21" fill="#EF6F5E">90%</text>
        <text class="n72" x="552" y="21" fill="#E9C04C">72%</text>
        <text class="n55" x="552" y="21" fill="#6FD08C">55%</text>
      </g>
    </g>

    <!-- app tiles: 3 x 2 -->
    <g font-size="16" font-weight="600">
      <!-- keep: Word -->
      <g transform="translate(584 140)">
        <rect width="176" height="108" rx="10" fill="#212E37" stroke="#31404A"/>
        <rect x="16" y="16" width="34" height="34" rx="8" fill="#4A7BD0"/><text x="33" y="39" text-anchor="middle" class="ink" font-size="17">W</text>
        <text x="16" y="78" class="ink">Thesis.docx</text>
        <text x="16" y="97" class="muted" font-size="13" font-weight="400">keep · your task</text>
      </g>
      <!-- keep: Acrobat (AI beats the idle timer) -->
      <g transform="translate(772 140)">
        <rect width="176" height="108" rx="10" fill="#212E37" stroke="#31404A"/>
        <rect x="16" y="16" width="34" height="34" rx="8" fill="#C9473B"/><text x="33" y="39" text-anchor="middle" class="ink" font-size="15">PDF</text>
        <text x="16" y="78" class="ink">Heat islands.pdf</text>
        <text x="16" y="97" class="muted" font-size="13" font-weight="400">idle 40 min</text>
        <g class="keep">
          <rect x="20" y="-13" width="164" height="26" rx="13" fill="#8ED8EE"/>
          <text x="102" y="5" text-anchor="middle" fill="#0C2430" font-size="12.5" font-weight="700">AI keeps it: your source</text>
        </g>
      </g>
      <!-- freeze: Discord -->
      <g transform="translate(960 140)">
        <g class="fz d1">
          <rect width="176" height="108" rx="10" fill="#212E37" stroke="#31404A"/>
          <rect x="16" y="16" width="34" height="34" rx="8" fill="#5865D9"/><text x="33" y="39" text-anchor="middle" class="ink" font-size="17">D</text>
          <text x="16" y="78" class="ink">Discord</text>
          <text x="16" y="97" class="muted" font-size="13" font-weight="400">612 MB</text>
        </g>
        <rect class="frostc d1" width="176" height="108" rx="10" fill="url(#frost)" stroke="#8ED8EE" stroke-width="1.5"/>
        <g transform="translate(146 30)"><use class="spin d1" href="#flake"/></g>
        <g class="tag"><rect x="98" y="66" width="64" height="24" rx="12" fill="none" stroke="#8ED8EE" stroke-dasharray="4 3"/><text x="130" y="82" text-anchor="middle" class="ice" font-size="12.5">freeze?</text></g>
      </g>
      <!-- freeze: Steam -->
      <g transform="translate(584 262)">
        <g class="fz d2">
          <rect width="176" height="108" rx="10" fill="#212E37" stroke="#31404A"/>
          <rect x="16" y="16" width="34" height="34" rx="8" fill="#2A475E"/><text x="33" y="39" text-anchor="middle" class="ink" font-size="17">S</text>
          <text x="16" y="78" class="ink">Steam</text>
          <text x="16" y="97" class="muted" font-size="13" font-weight="400">480 MB</text>
        </g>
        <rect class="frostc d2" width="176" height="108" rx="10" fill="url(#frost)" stroke="#8ED8EE" stroke-width="1.5"/>
        <g transform="translate(146 30)"><use class="spin d2" href="#flake"/></g>
        <g class="tag"><rect x="98" y="66" width="64" height="24" rx="12" fill="none" stroke="#8ED8EE" stroke-dasharray="4 3"/><text x="130" y="82" text-anchor="middle" class="ice" font-size="12.5">freeze?</text></g>
      </g>
      <!-- freeze: Teams -->
      <g transform="translate(772 262)">
        <g class="fz d3">
          <rect width="176" height="108" rx="10" fill="#212E37" stroke="#31404A"/>
          <rect x="16" y="16" width="34" height="34" rx="8" fill="#6264A7"/><text x="33" y="39" text-anchor="middle" class="ink" font-size="17">T</text>
          <text x="16" y="78" class="ink">Teams</text>
          <text x="16" y="97" class="muted" font-size="13" font-weight="400">540 MB</text>
        </g>
        <rect class="frostc d3" width="176" height="108" rx="10" fill="url(#frost)" stroke="#8ED8EE" stroke-width="1.5"/>
        <g transform="translate(146 30)"><use class="spin d3" href="#flake"/></g>
        <g class="tag"><rect x="98" y="66" width="64" height="24" rx="12" fill="none" stroke="#8ED8EE" stroke-dasharray="4 3"/><text x="130" y="82" text-anchor="middle" class="ice" font-size="12.5">freeze?</text></g>
      </g>
      <!-- freeze: Slack -->
      <g transform="translate(960 262)">
        <g class="fz d4">
          <rect width="176" height="108" rx="10" fill="#212E37" stroke="#31404A"/>
          <rect x="16" y="16" width="34" height="34" rx="8" fill="#4A154B"/><text x="33" y="39" text-anchor="middle" class="ink" font-size="17">S</text>
          <text x="16" y="78" class="ink">Slack</text>
          <text x="16" y="97" class="muted" font-size="13" font-weight="400">390 MB</text>
        </g>
        <rect class="frostc d4" width="176" height="108" rx="10" fill="url(#frost)" stroke="#8ED8EE" stroke-width="1.5"/>
        <g transform="translate(146 30)"><use class="spin d4" href="#flake"/></g>
        <g class="tag"><rect x="98" y="66" width="64" height="24" rx="12" fill="none" stroke="#8ED8EE" stroke-dasharray="4 3"/><text x="130" y="82" text-anchor="middle" class="ice" font-size="12.5">freeze?</text></g>
      </g>
    </g>

    <!-- the freeze sweep -->
    <rect class="sweep" x="560" y="44" width="160" height="352" fill="url(#sweep)"/>
  </g>
</svg>
