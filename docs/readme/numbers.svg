</defs>
<style>
text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
.in   { animation: in .9s cubic-bezier(.22,1,.36,1) both; }
.chip-in { animation: chipin .6s cubic-bezier(.22,1,.36,1) both; }
@keyframes in     { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes chipin { from { opacity: 0; transform: translateY(6px); }  to { opacity: 1; transform: none; } }
.loop { animation-timing-function: cubic-bezier(.65,0,.35,1); animation-iteration-count: infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.4s cubic-bezier(.22,1,.36,1) both; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.val { animation: val .7s cubic-bezier(.22,1,.36,1) both; }
@keyframes val { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
.sheen2 { animation: sheen2 5s cubic-bezier(.65,0,.35,1) infinite; }
@keyframes sheen2 { 0% { transform: translateX(0); } 30% { transform: translateX(760px); } 100% { transform: translateX(760px); } }
.halo { transform-box: fill-box; transform-origin: center; animation: halo 2.6s cubic-bezier(.65,0,.35,1) infinite alternate; }
@keyframes halo { from { transform: scale(1); opacity: .12; } to { transform: scale(1.25); opacity: .28; } }
</style>
