<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Results: Focus Freeze gets 88 of 88 on the blind test set, a keyword table 66% and an idle timer 57%; 0 unsafe freezes in 270 attack runs; about $0.002 per plan">
