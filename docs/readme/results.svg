<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Results: Focus Freeze 100 percent (88 of 88) on the blind test set vs keyword table 66 percent and idle timer 57 percent; 0 unsafe freezes in 270 attack runs; about $0.002 per plan">
  <title>Focus Freeze results</title>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .l { fill: #F1F5F7; font-size: 17px; font-weight: 600; }
    .m { fill: #A5B4BD; font-size: 14px; }
    .v { font-size: 20px; font-weight: 700; }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow 8s infinite cubic-bezier(.2,.8,.2,1); }
    .g2 { animation-delay: .25s; } .g3 { animation-delay: .5s; }
    @keyframes grow { 0% { transform: scaleX(0); } 18%,88% { transform: scaleX(1); } 96%,100% { transform: scaleX(0); } }
    .pop { opacity: 0; animation: pop 8s infinite; }
    .p2 { animation-delay: .25s; } .p3 { animation-delay: .5s; } .p4 { animation-delay: .9s; } .p5 { animation-delay: 1.2s; }
    @keyframes pop { 0%,14% { opacity: 0; } 20%,88% { opacity: 1; } 94%,100% { opacity: 0; } }
    .shine { animation: sh 8s infinite; opacity: 0; }
    @keyframes sh { 0%,20% { opacity: 0; transform: translateX(0); } 22% { opacity: .9; } 34% { opacity: 0; transform: translateX(560px); } 100% { opacity: 0; transform: translateX(560px); } }
    .shield { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s infinite ease-in-out; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  </style>
  <defs>
    <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="b1"><rect x="230" y="78" width="560" height="26" rx="13"/></clipPath>
  </defs>

  <rect width="1200" height="300" rx="22" fill="#121C23"/>
  <rect x=".5" y=".5" width="1199" height="299" rx="22" fill="none" stroke="#31404A"/>

  <text x="40" y="50" fill="#F1F5F7" font-size="20" font-weight="700">Which apps does your task need?</text>
  <text x="40" y="50" dx="322" class="m">blind test set, never tuned on</text>

  <!-- bars -->
  <text class="l" x="40" y="97">Focus Freeze</text><text class="m" x="40" y="116">Muse Spark 1.3</text>
  <rect x="230" y="78" width="560" height="26" rx="13" fill="#2A3843"/>
  <rect class="grow" x="230" y="78" width="560" height="26" rx="13" fill="#8ED8EE"/>
  <g clip-path="url(#b1)"><rect class="shine" x="170" y="78" width="80" height="26" fill="url(#sh)"/></g>
  <text class="v pop" x="806" y="99" fill="#8ED8EE">88 / 88</text>

  <text class="l" x="40" y="160">Keyword table</text>
  <rect x="230" y="142" width="560" height="26" rx="13" fill="#2A3843"/>
  <rect class="grow g2" x="230" y="142" width="370" height="26" rx="13" fill="#A5B4BD"/>
  <text class="v pop p2" x="616" y="163" fill="#A5B4BD">66%</text>

  <text class="l" x="40" y="222">Idle timer</text>
  <rect x="230" y="204" width="560" height="26" rx="13" fill="#2A3843"/>
  <rect class="grow g3" x="230" y="204" width="319" height="26" rx="13" fill="#F0B37E"/>
  <text class="v pop p3" x="565" y="225" fill="#F0B37E">57%</text>

  <!-- side tiles -->
  <g transform="translate(920 40)" class="pop p4">
    <rect width="244" height="104" rx="14" fill="#212E37" stroke="#31404A"/>
    <g class="shield" transform="translate(22 26)"><path d="M14 0 28 6V18C28 28 21 34 14 37 7 34 0 28 0 18V6Z" fill="#6FD08C" fill-opacity=".18" stroke="#6FD08C" stroke-width="2"/><path d="M8 18 12.5 22.5 20 14" stroke="#6FD08C" stroke-width="2.6" fill="none" stroke-linecap="round"/></g>
    <text x="68" y="48" fill="#6FD08C" font-size="30" font-weight="700">0 / 270</text>
    <text x="22" y="86" class="m">unsafe freezes in attack runs</text>
  </g>
  <g transform="translate(920 160)" class="pop p5">
    <rect width="244" height="104" rx="14" fill="#212E37" stroke="#31404A"/>
    <text x="22" y="52" fill="#F1F5F7" font-size="30" font-weight="700">~$0.002</text>
    <text x="22" y="86" class="m">per plan</text>
  </g>
</svg>
